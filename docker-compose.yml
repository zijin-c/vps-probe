services:
  dashboard:
    build: .
    image: nezha-ro:latest
    container_name: nezha-ro
    # 必须是 always：网页"上传恢复"后面板会自行退出，靠它重新拉起并应用备份
    restart: always
    ports:
      - "8008:8008"   # Web 面板 + Agent gRPC 共用端口，建议前面套 Nginx/Caddy 上 HTTPS
    volumes:
      - ./data:/dashboard/data
    environment:
      TZ: Asia/Shanghai
      # 也可以直接写在 data/probe.yaml 里
      # PROBE_TG_TOKEN: "123456:ABC..."
      # PROBE_TG_CHAT_IDS: "123456789"
