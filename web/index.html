    <title>VPS 探针</title>
    <script>
      try {
        var t = localStorage.getItem('probe-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
